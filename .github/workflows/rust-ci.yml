name: Rust CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.100.0'
  IMAGE_NAME: my-rust-app

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust, rustfmt and Clippy
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked -- -D warnings

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup override set "$RUST_VERSION"

      - name: Check code
        run: cargo check --locked --verbose

      - name: Build debug
        run: cargo build --locked --verbose

      - name: Build release
        run: cargo build --release --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker save -o "$RUNNER_TEMP/docker-image.tar" "$IMAGE_NAME:latest"
          gzip "$RUNNER_TEMP/docker-image.tar"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ runner.temp }}/docker-image.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Test Docker image
        shell: bash
        run: |
          status=0
          docker run --rm --network none "$IMAGE_NAME:latest" > "$RUNNER_TEMP/greeting.txt" || status=$?
          printf 'Application exit code: %s\n' "$status"
          test "$status" -eq 0
          printf '%s\n' 'Hello from Rust in Docker! 🦀' | cmp - "$RUNNER_TEMP/greeting.txt"
          cat "$RUNNER_TEMP/greeting.txt"
          user=$(docker run --rm --network none "$IMAGE_NAME:latest" id -un)
          uid=$(docker run --rm --network none "$IMAGE_NAME:latest" id -u)
          test "$user" = appuser
          test "$uid" -gt 0
          printf 'Container user: %s, UID: %s\n' "$user" "$uid"
